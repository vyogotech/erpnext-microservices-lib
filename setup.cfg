[flake8]
max-line-length = 120
# E203/W503: not PEP 8, conflict with common formatters.
# The W291/W293/W391/E3xx/E1xx entries silence pre-existing cosmetic whitespace
# and continuation-indent noise so the lint baseline is useful (catches real
# pyflakes errors and long lines) without forcing a full reformat.
extend-ignore =
    E203,
    W503,
    W291,
    W293,
    W391,
    W292,
    E303,
    E305,
    E128,
    E127,
    E126,
    E131,
    E122,
    E124,
    E402
exclude =
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    tests,
    examples
