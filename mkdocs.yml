site_name: Frappe Microservice Framework
repo_url: https://github.com/vyogotech/erpnext-microservices-lib
repo_name: vyogotech/erpnext-microservices-lib
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Tenancy: tenancy.md
  - Core Features: features.md
  - Security: security.md
  - Architecture: architecture.md
  - Observability: observability.md
  - CI/CD & Release: ci-cd.md
  - Developer Guide: development.md
  - Dependency Slimming: dependency-slimming.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
